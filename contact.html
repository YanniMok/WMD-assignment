<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #000000;
      font-family: Arial, sans-serif;
    }
    fieldset {
      border: 2px solid #f2ff00;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    legend {
      color: #000000;
      font-weight: bold;
    }
    label {
      font-weight: 500;
    }
    .form-container {
      max-width: 700px;
      margin: 40px auto;
      background: #fafafa;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    nav {
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      background: #000;
      position: sticky;
      top: 0;
      z-index: 100;
      height: 52px;
    }

    .nav-brand {
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      color: #fff;
      text-decoration: none;
      margin-right: 1.5rem;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .nav-links {
      display: flex;
      list-style: none;
      flex: 1;
      align-items: center;
      gap: 0.1rem;
    }

    .nav-links li { position: relative; }

    .nav-links li a {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.75rem;
      font-family: 'Barlow', sans-serif;
      font-weight: 400;
      font-size: 0.9rem;
      color: #ccc;
      text-decoration: none;
      transition: color 0.2s;
      white-space: nowrap;
    }

    .nav-links li a:hover { color: #fff; }

    .nav-links li a .caret { font-size: 0.65rem; opacity: 0.7; }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: #fff;
      min-width: 160px;
      border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 200;
      overflow: hidden;
    }

    .dropdown-menu a {
      display: block;
      padding: 0.65rem 1rem;
      font-family: 'Barlow', sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      color: #111 !important;
      text-decoration: none;
      white-space: nowrap;
    }

    .dropdown-menu a:hover { background: #f0f0f0; }

    .nav-links li.open .dropdown-menu { display: block; }

    .nav-search {
      display: flex;
      align-items: center;
      margin-left: auto;
    }

    .nav-search input {
      background: #fff;
      border: none;
      color: #333;
      font-family: 'Barlow', sans-serif;
      font-size: 0.88rem;
      outline: none;
      width: 200px;
      padding: 0.42rem 0.9rem;
      border-radius: 4px 0 0 4px;
    }

    .nav-search input::placeholder { color: #aaa; }

    .nav-search button {
      background: #0d6efd;
      border: none;
      color: #fff;
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: 0.88rem;
      padding: 0.42rem 1rem;
      cursor: pointer;
      border-radius: 0 4px 4px 0;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .nav-search button:hover { background: #0b5ed7; }

    .page-header {
      text-align: center;
      padding: 4rem 2rem 1rem;
    }
  </style>
</head>
<body>
    <nav>
    <a class="nav-brand" href="index.html">Lamborghini</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li id="models-dropdown-li">
        <a href="#" id="models-toggle">Models <span class="caret">▾</span></a>
        <div class="dropdown-menu">
          <a href="NewModels.html">New Models</a>
          <a href="OldModels.html">Old Models</a>
        </div>
      </li>
      <li><a href="Heritage.html">Heritage</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-search">
      <input type="text" placeholder="Search" />
      <button type="button">Search</button>
    </div>
  </nav>

<div class="container form-container">
  <h2 class="mb-4 text-center">Personal Details</h2>
  <form onsubmit="return validateForm()">


    <fieldset>
      <legend>Personal Information</legend>
      <div class="mb-3">
        <label for="fullname" class="form-label">Full name</label>
        <input type="text" id="fullname" name="fullname" class="form-control">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control">
      </div>
      <div class="mb-3">
        <label for="telephone" class="form-label">Phone number</label>
        <input type="tel" id="telephone" name="telephone" class="form-control">
      </div>
      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" id="address" name="address" class="form-control">
      </div>
    </fieldset>


    <fieldset>
      <legend>Vehicle of interest</legend>
      <div class="mb-3">
        <label for="jobtitle" class="form-label">Desired vehicle</label>
        <select id="jobtitle" name="jobtitle" class="form-select">
          <option>Huracan</option>
          <option>Urus</option>
          <option>Temerario</option>
          <option>Revuelto</option>
        </select>
      </div>

    <fieldset>
      <legend>Additional Message</legend>
      <textarea id="message" name="message" rows="4" class="form-control"></textarea>
    </fieldset>

    
    <div class="mt-3">
      <button type="submit" class="btn btn-primary">Submit</button>
      <button type="reset" class="btn btn-secondary">Reset</button>
    </div>
  </form>
</div>


<script>
function validateForm() {
  let name = document.getElementById("fullname").value;
  let email = document.getElementById("email").value;
  let telephone = document.getElementById("telephone").value;

  if (name === "" || email === "" || telephone === "") {
    alert("Please complete all required fields.");
    return false;
  }
 
  return true;
}

</script>

</body>
</html>
