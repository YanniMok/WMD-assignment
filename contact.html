<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Person Infromation</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #000000;
      font-family: Arial, sans-serif;
    }
    fieldset {
      border: 2px solid #f2ff00;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    legend {
      color: #000000;
      font-weight: bold;
    }
    label {
      font-weight: 500;
    }
    .form-container {
      max-width: 700px;
      margin: 40px auto;
      background: #fafafa;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<div class="container form-container">
  <h2 class="mb-4 text-center">Personal Details</h2>
  <form onsubmit="return validateForm()">


    <fieldset>
      <legend>Personal Information</legend>
      <div class="mb-3">
        <label for="fullname" class="form-label">Full name</label>
        <input type="text" id="fullname" name="fullname" class="form-control">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control">
      </div>
      <div class="mb-3">
        <label for="telephone" class="form-label">Phone number</label>
        <input type="tel" id="telephone" name="telephone" class="form-control">
      </div>
      <div class="mb-3">
        <label for="address" class="form-label">Address</label>
        <input type="text" id="address" name="address" class="form-control">
      </div>
    </fieldset>


    <fieldset>
      <legend>Vehicle of interest</legend>
      <div class="mb-3">
        <label for="jobtitle" class="form-label">Desired vehicle</label>
        <select id="jobtitle" name="jobtitle" class="form-select">
          <option>Huracan</option>
          <option>Urus</option>
          <option>Temerario</option>
          <option>Revuelto</option>
        </select>
      </div>

    <fieldset>
      <legend>Additional Message</legend>
      <textarea id="message" name="message" rows="4" class="form-control"></textarea>
    </fieldset>

    
    <div class="mt-3">
      <button type="submit" class="btn btn-primary">Submit</button>
      <button type="reset" class="btn btn-secondary">Reset</button>
    </div>
  </form>
</div>


<script>
function validateForm() {
  let name = document.getElementById("fullname").value;
  let email = document.getElementById("email").value;
  let telephone = document.getElementById("telephone").value;

  if (name === "" || email === "" || telephone === "") {
    alert("Please complete all required fields.");
    return false;
  }
 
  return true;
}

</script>

</body>
</html>
