<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lamborghini</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #c9a84c;
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222;
      --text: #e8e0d0;
      --muted: #888;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Barlow', sans-serif;
      font-weight: 300;
      line-height: 1.6;
    }

    nav {
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      background: #000;
      position: sticky;
      top: 0;
      z-index: 100;
      height: 52px;
    }

    .nav-brand {
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      color: #fff;
      text-decoration: none;
      margin-right: 1.5rem;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    .nav-links {
      display: flex;
      list-style: none;
      flex: 1;
      align-items: center;
      gap: 0.1rem;
    }

    .nav-links li { position: relative; }

    .nav-links li a {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.75rem;
      font-family: 'Barlow', sans-serif;
      font-weight: 400;
      font-size: 0.9rem;
      color: #ccc;
      text-decoration: none;
      transition: color 0.2s;
      white-space: nowrap;
    }

    .nav-links li a:hover { color: #fff; }

    .nav-links li a .caret { font-size: 0.65rem; opacity: 0.7; }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      background: #fff;
      min-width: 160px;
      border-radius: 4px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 200;
      overflow: hidden;
    }

    .dropdown-menu a {
      display: block;
      padding: 0.65rem 1rem;
      font-family: 'Barlow', sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      color: #111 !important;
      text-decoration: none;
      white-space: nowrap;
    }

    .dropdown-menu a:hover { background: #f0f0f0; }

    .nav-links li.open .dropdown-menu { display: block; }

    .nav-search {
      display: flex;
      align-items: center;
      margin-left: auto;
    }

    .nav-search input {
      background: #fff;
      border: none;
      color: #333;
      font-family: 'Barlow', sans-serif;
      font-size: 0.88rem;
      outline: none;
      width: 200px;
      padding: 0.42rem 0.9rem;
      border-radius: 4px 0 0 4px;
    }

    .nav-search input::placeholder { color: #aaa; }

    .nav-search button {
      background: #0d6efd;
      border: none;
      color: #fff;
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: 0.88rem;
      padding: 0.42rem 1rem;
      cursor: pointer;
      border-radius: 0 4px 4px 0;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .nav-search button:hover { background: #0b5ed7; }

    .hero {
      width: 100%;
      overflow: hidden;
      line-height: 0;
    }

    .hero img {
      width: 100%;
      display: block;
      object-fit: cover;
      max-height: 90vh;
      filter: brightness(0.85);
    }

    .about-section {
      padding: 5rem 2rem;
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .about-text h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.8rem, 3vw, 2.8rem);
      letter-spacing: 0.1em;
      color: #fff;
      margin-bottom: 1.2rem;
      line-height: 1.2;
    }

    .about-text h2 span {
      color: var(--gold);
    }

    .about-text p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.9;
      margin-bottom: 0.5rem;
    }

    .about-text p:last-child { margin-bottom: 0; }

    .about-video video {
      width: 100%;
      border-radius: 4px;
      display: block;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }

    .search-no-results {
      display: none;
      text-align: center;
      padding: 1rem 2rem;
      color: var(--muted);
      font-size: 0.95rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      max-width: 400px;
      margin: 1rem auto;
    }

    .search-highlight {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
      border-radius: 2px;
    }

    mark {
      background: rgba(201,168,76,0.35);
      color: #fff;
      border-radius: 2px;
      padding: 0 2px;
    }

    footer {
      background: #000;
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.05em;
    }

    @media (max-width: 768px) {
      .about-section { grid-template-columns: 1fr; gap: 2rem; }
      nav { height: auto; flex-wrap: wrap; gap: 0.4rem; padding: 0.6rem 1rem; }
      .nav-links { flex-wrap: wrap; }
      .nav-search { width: 100%; }
      .nav-search input { flex: 1; width: auto; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="nav-brand" href="index.html">Lamborghini</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li id="models-dropdown-li">
        <a href="#" id="models-toggle">Models <span class="caret">▾</span></a>
        <div class="dropdown-menu">
          <a href="NewModels.html">New Models</a>
          <a href="OldModels.html">Old Models</a>
        </div>
      </li>
      <li><a href="Heritage.html">Heritage</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-search">
      <input type="text" placeholder="Search">
      <button type="button">Search</button>
    </div>
  </nav>

  <div id="search-no-results" class="search-no-results">
    No results found for "<span id="search-term"></span>".
  </div>

  <section class="hero" id="section-hero">
    <img src="Lambo.jpg" alt="Lamborghini car">
  </section>

  <section class="about-section" id="section-about">
    <div class="about-text" id="about-text-block">
      <h2>Lamborghini is more than just <span>a brand</span></h2>
      <p>It is a lifestyle that cannot be changed.</p>
      <p>It is achieved by some.</p>
      <p>But appreciated by many.</p>
    </div>
    <div class="about-video">
      <video autoplay muted loop playsinline>
        <source src="lambVid.mp4" type="video/mp4">
      </video>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Lamborghini</p>
  </footer>

  <script>
    const modelsLi = document.getElementById('models-dropdown-li');
    const modelsToggle = document.getElementById('models-toggle');

    modelsToggle.addEventListener('click', e => {
      e.preventDefault();
      modelsLi.classList.toggle('open');
    });

    document.addEventListener('click', e => {
      if (!modelsLi.contains(e.target)) modelsLi.classList.remove('open');
    });

    const searchInput = document.querySelector('.nav-search input');
    const searchBtn = document.querySelector('.nav-search button');
    const noResultsBox = document.getElementById('search-no-results');
    const searchTermSpan = document.getElementById('search-term');

    const searchTargets = [
      { el: document.getElementById('about-text-block'), label: 'About' }
    ];

    function highlight(text, query) {
      if (!query) return text;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
    }

    function doSearch() {
      const query = searchInput.value.trim();

      searchTargets.forEach(t => {
        if (!t.original) t.original = t.el.innerHTML;
        t.el.innerHTML = t.original;
        t.el.classList.remove('search-highlight');
      });

      noResultsBox.style.display = 'none';

      if (!query) return;

      const q = query.toLowerCase();
      let matched = false;

      searchTargets.forEach(t => {
        const plainText = t.el.innerText || t.el.textContent;
        if (plainText.toLowerCase().includes(q)) {
          matched = true;
          t.el.innerHTML = highlight(t.original, query);
          t.el.classList.add('search-highlight');
          setTimeout(() => {
            t.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 50);
        }
      });

      if (!matched) {
        searchTermSpan.textContent = query;
        noResultsBox.style.display = 'block';
        noResultsBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    searchBtn.addEventListener('click', doSearch);
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    searchInput.addEventListener('input', () => { if (searchInput.value === '') doSearch(); });
  </script>

</body>
</html>
