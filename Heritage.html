<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lamborghini – Heritage</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav>
    <a class="nav-brand" href="index.html">Lamborghini</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li id="models-dropdown-li">
        <a href="#" id="models-toggle">Models <span class="caret">▾</span></a>
        <div class="dropdown-menu">
          <a href="NewModels.html">New Models</a>
          <a href="OldModels.html">Old Models</a>
        </div>
      </li>
      <li><a href="Heritage.html">Heritage</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-search">
      <input type="text" placeholder="Search" />
      <button type="button">Search</button>
    </div>
  </nav>

  <header class="page-header">
    <h1>Lamborghini Heritage</h1>
  </header>

  <section class="heritage-section">
    <div class="year-label" id="year-label">Year 1960s</div>

    <div class="slideshow-wrap">
      <button class="nav-arrow prev" id="btn-prev">
        <span class="arrow-icon">&#8249;</span>
        <span>Previous</span>
      </button>

      <div class="slide-img-wrap">
        <img id="slide-img" src="350gt.jpg" alt="Lamborghini 350 GT" />
      </div>

      <button class="nav-arrow next" id="btn-next">
        <span class="arrow-icon">&#8250;</span>
        <span>Next</span>
      </button>
    </div>

    <div class="year-dots" id="year-dots"></div>

    <div class="slide-desc">
      <h2 id="slide-title">350 GT — 1964</h2>
      <p id="slide-text"></p>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Lamborghini</p>
  </footer>

  <script>
    const slides = [
      {
        year: "Year 1960s",
        title: "350 GT — 1964",
        img: "350gt.jpg",
        alt: "Lamborghini 350 GT",
        text: "The 350 GT holds the distinction of being Lamborghini's first ever production car, launched in 1964. Designed by Carrozzeria Touring, it was built to rival Ferrari's grand tourers of the era. The 350 GT was powered by a 3.5-litre DOHC V12 engine producing 270 horsepower — an engine first designed in 1963 by the famed engineer Giotto Bizzarrini, originally built for competition. Lamborghini's engineers, led by Paolo Stanzani, adapted it for lower and medium speeds, making it more suitable as a production engine. The five-speed gearbox was provided by ZF, the suspension was independent for each wheel, and the car had all-round disc brakes. Its shape was a perfect example of 1960s automotive style, with elegant lines and perfect proportion. Only 143 units were ever produced, making it one of the rarest and most collectible Lamborghinis in existence."
      },
      {
        year: "Year 1966",
        title: "Miura — 1966",
        img: "miura.jpg",
        alt: "Lamborghini Miura",
        text: "Widely regarded as the world's first supercar, the Miura debuted in 1966 and completely redefined the automotive world. Styled by Marcello Gandini at Bertone, its low-slung, sensuous body remains one of the most beautiful car designs ever created. It featured a revolutionary mid-mounted transverse 3.9-litre V12 engine producing between 350 and 385 horsepower depending on the variant — the P400, P400S, or the ultimate P400SV. The Miura could reach 0–100 km/h in approximately 6.7 seconds with a top speed of 280 km/h, extraordinary figures for its era. The engine, gearbox, and differential were all housed in a single unit beneath that iconic rear bodywork. Fewer than 800 were built across all variants, and surviving examples are among the most sought-after collector cars in the world."
      },
      {
        year: "Year 1974",
        title: "Countach — 1974",
        img: "countach.jpg",
        alt: "Lamborghini Countach",
        text: "The Countach is perhaps the most iconic supercar of all time — a poster car for an entire generation. Produced from 1974 to 1990, it was again styled by Marcello Gandini and defined the wedge-shaped supercar era with its dramatic, angular bodywork and signature scissor doors — a Lamborghini trademark that continues to this day. Under its aggressive exterior sat a longitudinally mounted V12 engine ranging from 3.9 to 5.2 litres across its variants: the LP400, LP400S, LP500S, 5000 QV, and 25th Anniversary edition. Power ranged from 375 to 455 horsepower. The Countach could sprint from 0–100 km/h in around 5.2 seconds with a top speed of up to 295 km/h. It was Lamborghini's definitive statement to the world — raw, uncompromising, and utterly unforgettable."
      }
    ];

    let current = 0;

    const yearLabel = document.getElementById('year-label');
    const slideImg = document.getElementById('slide-img');
    const slideTitle = document.getElementById('slide-title');
    const slideText = document.getElementById('slide-text');
    const dotsWrap = document.getElementById('year-dots');

    slides.forEach((_, i) => {
      const dot = document.createElement('div');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(dot);
    });

    function updateDots() {
      document.querySelectorAll('.dot').forEach((d, i) => {
        d.classList.toggle('active', i === current);
      });
    }

    function goTo(index) {
      slideImg.classList.add('fade');
      setTimeout(() => {
        current = index;
        const s = slides[current];
        yearLabel.textContent = s.year;
        slideImg.src = s.img;
        slideImg.alt = s.alt;
        slideTitle.textContent = s.title;
        slideText.textContent = s.text;
        updateDots();
        slideImg.classList.remove('fade');
      }, 400);
    }

    document.getElementById('btn-prev').addEventListener('click', () => {
      goTo((current - 1 + slides.length) % slides.length);
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      goTo((current + 1) % slides.length);
    });

    slideText.textContent = slides[0].text;

    const modelsLi = document.getElementById('models-dropdown-li');
    const modelsToggle = document.getElementById('models-toggle');

    modelsToggle.addEventListener('click', e => {
      e.preventDefault();
      modelsLi.classList.toggle('open');
    });

    document.addEventListener('click', e => {
      if (!modelsLi.contains(e.target)) modelsLi.classList.remove('open');
    });

    const searchInput = document.querySelector('.nav-search input');
    const searchBtn = document.querySelector('.nav-search button');

    function doSearch() {
      const query = searchInput.value.trim().toLowerCase();
      if (!query) return;
      const idx = slides.findIndex(s =>
        s.title.toLowerCase().includes(query) ||
        s.text.toLowerCase().includes(query) ||
        s.year.toLowerCase().includes(query)
      );
      if (idx !== -1) goTo(idx);
    }

    searchBtn.addEventListener('click', doSearch);
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  </script>

</body>
</html>
